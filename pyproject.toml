[project]
name = "entirius-django-stock-alerts"
version = "0.1.0"
description = "Back-in-stock alerts for Entirius: storefront requests, consent and GDPR hooks"
keywords = ["django", "back-in-stock", "stock-alerts", "notify-me", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.14",
    "drf-spectacular>=0.27",
    "pydantic[email]>=2.0",
    "entirius-django-utils>=2.4.0",
    "entirius-django-matrix>=4.5.0",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]
# Soft dependencies: without access the subscribe route is open behind its throttles; without agreements the
# consent stays on the request row only.
access = ["entirius-django-access>=1.1.0"]
agreements = ["entirius-django-agreements>=3.1.0"]
# The suite runs with agreements installed and without it (STOCK_ALERTS_TEST_NO_AGREEMENTS=1).
test = [
    "pytest",
    "pytest-django",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
    "entirius-django-agreements>=3.1.0",
]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-stock-alerts/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-stock-alerts"
Changelog = "https://github.com/entirius/entirius-django-stock-alerts/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-stock-alerts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_stock_alerts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_stock_alerts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# Soft dependencies, imported lazily behind apps.is_installed(): extras `access` and `agreements`.
DEP001 = ["django_access", "django_agreements", "django_leads"]
